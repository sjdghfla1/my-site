<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тетрис Сайт с Онлайн-Чатом</title>
    <!-- Подключаем легкую библиотеку для онлайн-связи через WebSocket/MQTT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        /* Шапка сайта */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .header-logo {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-color);
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background: #21262d;
            border-color: #8b949e;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        /* Главная область */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 15px;
            gap: 15px;
        }

        /* Секция Тетриса */
        .tetris-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 340px;
            width: 100%;
        }

        .tetris-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .tetris-score span {
            color: var(--primary);
            font-size: 16px;
        }

        #tetrisCanvas {
            background: #0d1117;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            display: block;
        }

        /* Кнопки управления для телефона */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 14px;
        }

        .ctrl-btn {
            background: #21262d;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px 0;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }

        .ctrl-btn:active {
            background: var(--primary);
        }

        /* Секция ЧАТА */
        .chat-container {
            width: 100%;
            max-width: 340px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }

        .chat-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .chat-messages {
            height: 200px;
            overflow-y: auto;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        .chat-msg {
            font-size: 12px;
            word-break: break-word;
        }

        .chat-msg-header {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 3px;
        }

        .chat-msg-author {
            font-weight: 600;
            color: #818cf8;
        }

        .chat-msg-time {
            font-size: 10px;
            color: var(--text-muted);
        }

        .chat-msg-text {
            color: var(--text-color);
            background: #21262d;
            padding: 6px 10px;
            border-radius: 8px;
            display: inline-block;
            line-height: 1.3;
        }

        .chat-input-box {
            display: flex;
            gap: 6px;
        }

        /* Секция профиля */
        .profile-container {
            display: none;
            width: 100%;
            max-width: 340px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }

        .profile-avatar-display {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background-color: var(--primary);
            background-size: cover;
            background-position: center;
            border: 2px solid var(--border-color);
        }

        .profile-username {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .profile-role {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        /* Выбор аватарки */
        .avatar-section {
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: left;
        }

        .avatar-section h4 {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preset-avatars {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            justify-content: center;
        }

        .preset-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: #21262d;
            font-size: 16px;
            cursor: pointer;
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 24px;
            width: 90%;
            max-width: 320px;
            position: relative;
            text-align: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .close-btn {
            position: absolute;
            top: 14px; right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .emoji-art-box {
            font-size: 32px;
            line-height: 1.1;
            margin: 15px 0 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            padding: 8px 10px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .modal-switch {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        .modal-switch span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="header-logo">🎮 Тетрис</div>
        <div class="nav-buttons" id="navButtons"></div>
    </header>

    <!-- Всплывающее окно со смайликами при входе -->
    <div class="modal-overlay active" id="welcomeModal">
        <div class="modal">
            <button class="close-btn" onclick="closeWelcomeModal()">&times;</button>
            <div class="modal-title">Приветствие</div>
            
            <div class="emoji-art-box">
                <div>🟥</div>
                <div>🟫</div>
                <div>🟫🟫🟫</div>
            </div>

            <button class="btn btn-primary" style="width: 100%;" onclick="closeWelcomeModal()">Закрыть</button>
        </div>
    </div>

    <!-- Основной контент -->
    <main>
        <!-- Вид по умолчанию (Тетрис + Чат) -->
        <div id="mainView" style="display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%;">
            
            <!-- Тетрис игра -->
            <div class="tetris-container">
                <div class="tetris-header">
                    <div>ТЕТРИС</div>
                    <div class="tetris-score">Очки: <span id="scoreVal">0</span></div>
                </div>

                <canvas id="tetrisCanvas" width="200" height="400"></canvas>

                <button class="btn btn-primary" id="startBtn" onclick="toggleGame()" style="width: 100%; margin-top: 12px;">Старт / Пауза</button>

                <!-- Кнопки управления для телефона -->
                <div class="controls">
                    <button class="ctrl-btn" onclick="moveLeft()">◄</button>
                    <button class="ctrl-btn" onclick="rotate()">🔄</button>
                    <button class="ctrl-btn" onclick="moveRight()">►</button>
                    <div></div>
                    <button class="ctrl-btn" onclick="moveDown()">▼</button>
                    <div></div>
                </div>
            </div>

            <!-- Чат пользователей -->
            <div class="chat-container">
                <div class="chat-title">ОБЩИЙ ЧАТ</div>

                <div class="chat-messages" id="chatMessages"></div>

                <form class="chat-input-box" onsubmit="sendChatMessage(event)">
                    <input type="text" id="chatInput" class="form-control" placeholder="Напишите сообщение..." maxlength="200" required autocomplete="off">
                    <button type="submit" class="btn btn-primary">Отправить</button>
                </form>
            </div>

        </div>

        <!-- Профиль пользователя -->
        <div id="profileView" class="profile-container">
            <div class="profile-avatar-display" id="profileAvatar">👤</div>
            <div class="profile-username" id="profileUsername">Логин</div>
            <div class="profile-role">Участник</div>

            <div class="avatar-section">
                <h4>Выберите аватарку:</h4>
                <div class="preset-avatars">
                    <button class="preset-btn" onclick="setPresetAvatar('😎')">😎</button>
                    <button class="preset-btn" onclick="setPresetAvatar('🚀')">🚀</button>
                    <button class="preset-btn" onclick="setPresetAvatar('🔥')">🔥</button>
                    <button class="preset-btn" onclick="setPresetAvatar('👾')">👾</button>
                    <button class="preset-btn" onclick="setPresetAvatar('🐱')">🐱</button>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <input type="text" id="avatarUrlInput" class="form-control" placeholder="Ссылка на фото..." onchange="setImageAvatar(this.value)">
                </div>
            </div>

            <button class="btn btn-outline" style="width: 100%; margin-bottom: 8px;" onclick="showMainView()">К игре и чату</button>
            <button class="btn btn-outline" style="width: 100%; color: #f87171; border-color: rgba(248, 113, 113, 0.3);" onclick="logout()">Выйти</button>
        </div>
    </main>

    <!-- Авторизация -->
    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <button class="close-btn" onclick="closeAuthModal()">&times;</button>
            <div class="modal-title" id="modalTitle">Вход</div>
            
            <form onsubmit="handleAuthSubmit(event)">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="authLogin" class="form-control" placeholder="Логин" required minlength="3">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="authPassword" class="form-control" placeholder="Пароль" required minlength="4">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 6px;" id="authSubmitBtn">Войти</button>
            </form>

            <div class="modal-switch" id="authSwitchText">
                Нет аккаунта? <span onclick="toggleAuthMode(true)">Зарегистрироваться</span>
            </div>
        </div>
    </div>

    <script>
        function closeWelcomeModal() {
            document.getElementById('welcomeModal').classList.remove('active');
        }

        // --- 1. ЛОГИКА АВТОРИЗАЦИИ И ПРОФИЛЯ ---
        let users = JSON.parse(localStorage.getItem('usynin_users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('usynin_currentUser')) || null;
        let isRegisterMode = false;

        function updateNav() {
            const nav = document.getElementById('navButtons');
            if (currentUser) {
                nav.innerHTML = `
                    <button class="btn btn-outline" onclick="showProfileView()">${currentUser.login}</button>
                    <button class="btn btn-primary" onclick="logout()">Выйти</button>
                `;
            } else {
                nav.innerHTML = `
                    <button class="btn btn-outline" onclick="openAuthModal(false)">Войти</button>
                    <button class="btn btn-primary" onclick="openAuthModal(true)">Регистрация</button>
                `;
            }
        }

        function showMainView() {
            document.getElementById('mainView').style.display = 'flex';
            document.getElementById('profileView').style.display = 'none';
        }

        function showProfileView() {
            if (!currentUser) return;
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('profileView').style.display = 'block';
            document.getElementById('profileUsername').textContent = currentUser.login;
            renderAvatar();
        }

        function renderAvatar() {
            const avatarDiv = document.getElementById('profileAvatar');
            const avatarUrlInput = document.getElementById('avatarUrlInput');

            if (currentUser.avatar && currentUser.avatar.startsWith('http')) {
                avatarDiv.style.backgroundImage = `url('${currentUser.avatar}')`;
                avatarDiv.textContent = '';
                avatarUrlInput.value = currentUser.avatar;
            } else {
                avatarDiv.style.backgroundImage = 'none';
                avatarDiv.textContent = currentUser.avatar || '👤';
                avatarUrlInput.value = '';
            }
        }

        function setPresetAvatar(emoji) {
            if (!currentUser) return;
            currentUser.avatar = emoji;
            saveCurrentUserData();
            renderAvatar();
        }

        function setImageAvatar(url) {
            if (!currentUser || !url.trim()) return;
            currentUser.avatar = url.trim();
            saveCurrentUserData();
            renderAvatar();
        }

        function saveCurrentUserData() {
            localStorage.setItem('usynin_currentUser', JSON.stringify(currentUser));
            const userIndex = users.findIndex(u => u.login.toLowerCase() === currentUser.login.toLowerCase());
            if (userIndex !== -1) {
                users[userIndex].avatar = currentUser.avatar;
                localStorage.setItem('usynin_users', JSON.stringify(users));
            }
        }

        function openAuthModal(registerMode) {
            toggleAuthMode(registerMode);
            document.getElementById('authModal').classList.add('active');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
        }

        function toggleAuthMode(registerMode) {
            isRegisterMode = registerMode;
            document.getElementById('modalTitle').textContent = isRegisterMode ? 'Регистрация' : 'Вход';
            document.getElementById('authSubmitBtn').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
            
            const switchText = document.getElementById('authSwitchText');
            if (isRegisterMode) {
                switchText.innerHTML = `Уже есть аккаунт? <span onclick="toggleAuthMode(false)">Войти</span>`;
            } else {
                switchText.innerHTML = `Нет аккаунта? <span onclick="toggleAuthMode(true)">Зарегистрироваться</span>`;
            }
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const login = document.getElementById('authLogin').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            if (isRegisterMode) {
                if (users.some(u => u.login.toLowerCase() === login.toLowerCase())) {
                    alert('Пользователь с таким логином уже есть!');
                    return;
                }
                const newUser = { login, password, avatar: '😎' };
                users.push(newUser);
                localStorage.setItem('usynin_users', JSON.stringify(users));
                currentUser = newUser;
            } else {
                const user = users.find(u => u.login.toLowerCase() === login.toLowerCase() && u.password === password);
                if (!user) {
                    alert('Неверный логин или пароль!');
                    return;
                }
                currentUser = user;
            }

            localStorage.setItem('usynin_currentUser', JSON.stringify(currentUser));
            closeAuthModal();
            updateNav();
            showProfileView();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('usynin_currentUser');
            updateNav();
            showMainView();
        }

        updateNav();

        // --- 2. РЕАЛЬНЫЙ ОНЛАЙН-ЧАТ МЕЖДУ ВСЕМИ УСТРОЙСТВАМИ (MQTT WebSocket) ---
        const CHAT_TOPIC = "usynin_tetris_global_chat_v1";
        let mqttClient = null;
        let chatMessages = JSON.parse(localStorage.getItem('usynin_chat_messages')) || [];

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function renderChatMessages() {
            const container = document.getElementById('chatMessages');
            if (!container) return;
            container.innerHTML = '';

            if (chatMessages.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 80px;">Сообщений пока нет. Напишите первым!</div>`;
                return;
            }

            chatMessages.forEach(msg => {
                const msgEl = document.createElement('div');
                msgEl.className = 'chat-msg';
                msgEl.innerHTML = `
                    <div class="chat-msg-header">
                        <span style="font-size: 13px;">${msg.avatar || '👤'}</span>
                        <span class="chat-msg-author">${escapeHtml(msg.author)}</span>
                        <span class="chat-msg-time">${msg.time}</span>
                    </div>
                    <div class="chat-msg-text">${escapeHtml(msg.text)}</div>
                `;
                container.appendChild(msgEl);
            });

            container.scrollTop = container.scrollHeight;
        }

        function initOnlineChat() {
            try {
                const clientId = "client_" + Math.random().toString(36).substring(2, 10);
                mqttClient = new Paho.MQTT.Client("broker.emqx.io", 8084, clientId);

                mqttClient.onMessageArrived = function (message) {
                    try {
                        const msg = JSON.parse(message.payloadString);
                        // Проверка на дублирование по уникальному ID
                        if (!chatMessages.some(m => m.id === msg.id)) {
                            chatMessages.push(msg);
                            if (chatMessages.length > 50) chatMessages.shift();
                            localStorage.setItem('usynin_chat_messages', JSON.stringify(chatMessages));
                            renderChatMessages();
                        }
                    } catch (e) {
                        console.error("Ошибка чтения сообщения", e);
                    }
                };

                mqttClient.connect({
                    useSSL: true,
                    timeout: 5,
                    onSuccess: function () {
                        mqttClient.subscribe(CHAT_TOPIC);
                    },
                    onFailure: function (err) {
                        console.log("MQTT Подключение не удалось, чат работает локально", err);
                    }
                });
            } catch (e) {
                console.error("Ошибка инициализации онлайн чата", e);
            }
        }

        function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const author = currentUser ? currentUser.login : 'Гость';
            let avatar = '👤';
            if (currentUser && currentUser.avatar) {
                avatar = currentUser.avatar.startsWith('http') ? '🖼' : currentUser.avatar;
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const newMsg = {
                id: Date.now() + '_' + Math.random().toString(36).substring(2, 7),
                author: author,
                avatar: avatar,
                text: text,
                time: timeStr
            };

            // Добавляем к себе
            chatMessages.push(newMsg);
            if (chatMessages.length > 50) chatMessages.shift();
            localStorage.setItem('usynin_chat_messages', JSON.stringify(chatMessages));
            renderChatMessages();

            // Отправляем через сеть всем остальным
            if (mqttClient && mqttClient.isConnected()) {
                const message = new Paho.MQTT.Message(JSON.stringify(newMsg));
                message.destinationName = CHAT_TOPIC;
                mqttClient.send(message);
            }

            input.value = '';
        }

        renderChatMessages();
        initOnlineChat();

        // --- 3. ИГРА ТЕТРИС ---
        const canvas = document.getElementById('tetrisCanvas');
        const ctx = canvas.getContext('2d');
        const ROWS = 20;
        const COLS = 10;
        const BLOCK_SIZE = 20;

        let board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        let score = 0;
        let gameInterval = null;
        let isRunning = false;

        const SHAPES = [
            [[1, 1, 1, 1]], // I
            [[1, 1], [1, 1]], // O
            [[0, 1, 0], [1, 1, 1]], // T
            [[1, 0, 0], [1, 1, 1]], // L
            [[0, 0, 1], [1, 1, 1]], // J
            [[0, 1, 1], [1, 0, 0]], // S
            [[1, 1, 0], [0, 1, 1]]  // Z
        ];

        const COLORS = ['#00f0f0', '#f0f000', '#a000f0', '#f0a000', '#0000f0', '#00f000', '#f00000'];

        let currentPiece = getRandomPiece();

        function getRandomPiece() {
            const idx = Math.floor(Math.random() * SHAPES.length);
            return {
                shape: SHAPES[idx],
                color: COLORS[idx],
                row: 0,
                col: Math.floor(COLS / 2) - Math.ceil(SHAPES[idx][0].length / 2)
            };
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (board[r][c]) {
                        ctx.fillStyle = board[r][c];
                        ctx.fillRect(c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                    }
                }
            }
            drawPiece(currentPiece);
        }

        function drawPiece(piece) {
            ctx.fillStyle = piece.color;
            piece.shape.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value) {
                        ctx.fillRect((piece.col + c) * BLOCK_SIZE, (piece.row + r) * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
                    }
                });
            });
        }

        function isValidMove(piece, rowOffset, colOffset, newShape) {
            const shape = newShape || piece.shape;
            for (let r = 0; r < shape.length; r++) {
                for (let c = 0; c < shape[r].length; c++) {
                    if (shape[r][c]) {
                        let newRow = piece.row + r + rowOffset;
                        let newCol = piece.col + c + colOffset;
                        if (newRow >= ROWS || newCol < 0 || newCol >= COLS || (newRow >= 0 && board[newRow][newCol])) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function moveDown() {
            if (!isRunning) return;
            if (isValidMove(currentPiece, 1, 0)) {
                currentPiece.row++;
            } else {
                lockPiece();
                clearLines();
                currentPiece = getRandomPiece();
                if (!isValidMove(currentPiece, 0, 0)) {
                    alert('Игра окончена! Ваши очки: ' + score);
                    resetGame();
                }
            }
            drawBoard();
        }

        function moveLeft() {
            if (isRunning && isValidMove(currentPiece, 0, -1)) {
                currentPiece.col--;
                drawBoard();
            }
        }

        function moveRight() {
            if (isRunning && isValidMove(currentPiece, 0, 1)) {
                currentPiece.col++;
                drawBoard();
            }
        }

        function rotate() {
            if (!isRunning) return;
            const rotated = currentPiece.shape[0].map((_, i) => currentPiece.shape.map(row => row[i]).reverse());
            if (isValidMove(currentPiece, 0, 0, rotated)) {
                currentPiece.shape = rotated;
                drawBoard();
            }
        }

        function lockPiece() {
            currentPiece.shape.forEach((row, r) => {
                row.forEach((val, c) => {
                    if (val) {
                        board[currentPiece.row + r][currentPiece.col + c] = currentPiece.color;
                    }
                });
            });
        }

        function clearLines() {
            let linesCleared = 0;
            for (let r = ROWS - 1; r >= 0; r--) {
                if (board[r].every(cell => cell !== 0)) {
                    board.splice(r, 1);
                    board.unshift(Array(COLS).fill(0));
                    linesCleared++;
                    r++;
                }
            }
            if (linesCleared > 0) {
                score += linesCleared * 100;
                document.getElementById('scoreVal').textContent = score;
            }
        }

        function toggleGame() {
            if (isRunning) {
                clearInterval(gameInterval);
                isRunning = false;
                document.getElementById('startBtn').textContent = 'Продолжить';
            } else {
                isRunning = true;
                gameInterval = setInterval(moveDown, 500);
                document.getElementById('startBtn').textContent = 'Пауза';
            }
        }

        function resetGame() {
            clearInterval(gameInterval);
            board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
            score = 0;
            document.getElementById('scoreVal').textContent = score;
            isRunning = false;
            currentPiece = getRandomPiece();
            document.getElementById('startBtn').textContent = 'Старт';
            drawBoard();
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') moveLeft();
            if (e.key === 'ArrowRight') moveRight();
            if (e.key === 'ArrowDown') moveDown();
            if (e.key === 'ArrowUp') rotate();
        });

        drawBoard();
    </script>
</body>
</html>
