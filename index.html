<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт Усынина Димы</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            cursor: pointer;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover {
            background: #21262d;
            border-color: #8b949e;
        }

        .btn-primary {
            background: var(--primary);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        main {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .hero-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            color: #f0f6fc;
            max-width: 600px;
            line-height: 1.3;
        }

        .profile-container {
            display: none;
            width: 100%;
            max-width: 360px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }

        .profile-avatar-display {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background-color: var(--primary);
            background-size: cover;
            background-position: center;
            border: 2px solid var(--border-color);
        }

        .profile-username {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .profile-role {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .avatar-section {
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 16px;
            text-align: left;
        }

        .avatar-section h4 {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .preset-avatars {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            justify-content: center;
        }

        .preset-btn {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: #21262d;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .preset-btn:hover {
            transform: scale(1.1);
            border-color: var(--primary);
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 24px;
            width: 90%;
            max-width: 340px;
            position: relative;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .close-btn {
            position: absolute;
            top: 14px; right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            padding: 8px 10px;
            background: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .modal-switch {
            margin-top: 12px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }

        .modal-switch span {
            color: var(--primary);
            cursor: pointer;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showMainView()">Усынин Дима</div>
        <div class="nav-buttons" id="navButtons"></div>
    </header>

    <main>
        <div id="mainView" class="hero-title">
            Сайт сделан Усыниным Димой
        </div>

        <div id="profileView" class="profile-container">
            <div class="profile-avatar-display" id="profileAvatar">👤</div>
            <div class="profile-username" id="profileUsername">Логин</div>
            <div class="profile-role">Участник</div>

            <div class="avatar-section">
                <h4>Выберите аватарку:</h4>
                <div class="preset-avatars">
                    <button class="preset-btn" onclick="setPresetAvatar('😎')">😎</button>
                    <button class="preset-btn" onclick="setPresetAvatar('🚀')">🚀</button>
                    <button class="preset-btn" onclick="setPresetAvatar('🔥')">🔥</button>
                    <button class="preset-btn" onclick="setPresetAvatar('👾')">👾</button>
                    <button class="preset-btn" onclick="setPresetAvatar('🐱')">🐱</button>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <input type="text" id="avatarUrlInput" class="form-control" placeholder="Ссылка на фото..." onchange="setImageAvatar(this.value)">
                </div>
            </div>

            <button class="btn btn-outline" style="width: 100%; color: #f87171; border-color: rgba(248, 113, 113, 0.3);" onclick="logout()">Выйти</button>
        </div>
    </main>

    <div class="modal-overlay" id="authModal">
        <div class="modal">
            <button class="close-btn" onclick="closeAuthModal()">&times;</button>
            <div class="modal-title" id="modalTitle">Вход</div>
            
            <form onsubmit="handleAuthSubmit(event)">
                <div class="form-group">
                    <label>Логин</label>
                    <input type="text" id="authLogin" class="form-control" placeholder="Логин" required minlength="3">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" id="authPassword" class="form-control" placeholder="Пароль" required minlength="4">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 6px;" id="authSubmitBtn">Войти</button>
            </form>

            <div class="modal-switch" id="authSwitchText">
                Нет аккаунта? <span onclick="toggleAuthMode(true)">Зарегистрироваться</span>
            </div>
        </div>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('usynin_users')) || [];
        let currentUser = JSON.parse(localStorage.getItem('usynin_currentUser')) || null;
        let isRegisterMode = false;

        function init() {
            updateNav();
            showMainView();
        }

        function updateNav() {
            const nav = document.getElementById('navButtons');
            if (currentUser) {
                nav.innerHTML = `
                    <button class="btn btn-outline" onclick="showProfileView()">${currentUser.login}</button>
                    <button class="btn btn-primary" onclick="logout()">Выйти</button>
                `;
            } else {
                nav.innerHTML = `
                    <button class="btn btn-outline" onclick="openAuthModal(false)">Войти</button>
                    <button class="btn btn-primary" onclick="openAuthModal(true)">Регистрация</button>
                `;
            }
        }

        function showMainView() {
            document.getElementById('mainView').style.display = 'block';
            document.getElementById('profileView').style.display = 'none';
        }

        function showProfileView() {
            if (!currentUser) return;
            document.getElementById('mainView').style.display = 'none';
            document.getElementById('profileView').style.display = 'block';
            document.getElementById('profileUsername').textContent = currentUser.login;
            renderAvatar();
        }

        function renderAvatar() {
            const avatarDiv = document.getElementById('profileAvatar');
            const avatarUrlInput = document.getElementById('avatarUrlInput');

            if (currentUser.avatar && currentUser.avatar.startsWith('http')) {
                avatarDiv.style.backgroundImage = `url('${currentUser.avatar}')`;
                avatarDiv.textContent = '';
                avatarUrlInput.value = currentUser.avatar;
            } else {
                avatarDiv.style.backgroundImage = 'none';
                avatarDiv.textContent = currentUser.avatar || '👤';
                avatarUrlInput.value = '';
            }
        }

        function setPresetAvatar(emoji) {
            if (!currentUser) return;
            currentUser.avatar = emoji;
            saveCurrentUserData();
            renderAvatar();
        }

        function setImageAvatar(url) {
            if (!currentUser || !url.trim()) return;
            currentUser.avatar = url.trim();
            saveCurrentUserData();
            renderAvatar();
        }

        function saveCurrentUserData() {
            localStorage.setItem('usynin_currentUser', JSON.stringify(currentUser));
            const userIndex = users.findIndex(u => u.login.toLowerCase() === currentUser.login.toLowerCase());
            if (userIndex !== -1) {
                users[userIndex].avatar = currentUser.avatar;
                localStorage.setItem('usynin_users', JSON.stringify(users));
            }
        }

        function openAuthModal(registerMode) {
            toggleAuthMode(registerMode);
            document.getElementById('authModal').classList.add('active');
        }

        function closeAuthModal() {
            document.getElementById('authModal').classList.remove('active');
            document.getElementById('authLogin').value = '';
            document.getElementById('authPassword').value = '';
        }

        function toggleAuthMode(registerMode) {
            isRegisterMode = registerMode;
            document.getElementById('modalTitle').textContent = isRegisterMode ? 'Регистрация' : 'Вход';
            document.getElementById('authSubmitBtn').textContent = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
            
            const switchText = document.getElementById('authSwitchText');
            if (isRegisterMode) {
                switchText.innerHTML = `Уже есть аккаунт? <span onclick="toggleAuthMode(false)">Войти</span>`;
            } else {
                switchText.innerHTML = `Нет аккаунта? <span onclick="toggleAuthMode(true)">Зарегистрироваться</span>`;
            }
        }

        function handleAuthSubmit(e) {
            e.preventDefault();
            const login = document.getElementById('authLogin').value.trim();
            const password = document.getElementById('authPassword').value.trim();

            if (isRegisterMode) {
                const userExists = users.some(u => u.login.toLowerCase() === login.toLowerCase());
                if (userExists) {
                    alert('Пользователь с таким логином уже есть!');
                    return;
                }

                const newUser = { login, password, avatar: '😎' };
                users.push(newUser);
                localStorage.setItem('usynin_users', JSON.stringify(users));
                currentUser = newUser;
            } else {
                const user = users.find(u => u.login.toLowerCase() === login.toLowerCase() && u.password === password);
                if (!user) {
                    alert('Неверный логин или пароль!');
                    return;
                }
                currentUser = user;
            }

            localStorage.setItem('usynin_currentUser', JSON.stringify(currentUser));
            closeAuthModal();
            updateNav();
            showProfileView();
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('usynin_currentUser');
            updateNav();
            showMainView();
        }

        init();
    </script>
</body>
</html>
