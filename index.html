<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой Портал</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { color: #38bdf8; margin-bottom: 20px; text-align: center; }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: #334155; color: #fff; }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }
        .card {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }
        .game-container { display: none; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
        .game-container.active { display: flex; }
        canvas {
            background: #090d16;
            border: 2px solid #334155;
            border-radius: 8px;
        }
        .btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #7dd3fc; }
        .info { color: #94a3b8; font-size: 13px; text-align: center; }
        .score { font-size: 18px; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>

    <h1>🎮 Игровой Портал</h1>

    <!-- Переключатели игр -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchGame('tetris')">Тетрис</button>
        <button class="tab-btn" onclick="switchGame('snake')">Змейка</button>
        <button class="tab-btn" onclick="switchGame('pong')">Понг</button>
    </div>

    <div class="card">
        <!-- ТЕТРИС -->
        <div id="tetris-game" class="game-container active">
            <div class="score">Счет: <span id="tetris-score">0</span></div>
            <canvas id="tetris" width="200" height="400"></canvas>
            <button class="btn" onclick="startTetris()">Старт / Старт заново</button>
            <div class="info">Управление: ← → (влево/вправо), ↑ (поворот), ↓ (ускорение)</div>
        </div>

        <!-- ЗМЕЙКА -->
        <div id="snake-game" class="game-container">
            <div class="score">Счет: <span id="snake-score">0</span></div>
            <canvas id="snake" width="300" height="300"></canvas>
            <button class="btn" onclick="startSnake()">Старт / Старт заново</button>
            <div class="info">Управление: Клавиши Стрелок (← ↑ → ↓)</div>
        </div>

        <!-- ПОНГ -->
        <div id="pong-game" class="game-container">
            <div class="score">Игрок: <span id="pong-player">0</span> | ИИ: <span id="pong-ai">0</span></div>
            <canvas id="pong" width="320" height="320"></canvas>
            <button class="btn" onclick="startPong()">Старт / Старт заново</button>
21:25


<div class="info">Управление: Движение мышкой или клавиши ↑ ↓</div>
        </div>
    </div>

    <script>
        let currentInterval = null;

        function stopAllGames() {
            if (currentInterval) clearInterval(currentInterval);
        }

        function switchGame(game) {
            stopAllGames();
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.game-container').forEach(c => c.classList.remove('active'));

            if (game === 'tetris') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tetris-game').classList.add('active');
                startTetris();
            } else if (game === 'snake') {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('snake-game').classList.add('active');
                startSnake();
            } else if (game === 'pong') {
                document.querySelectorAll('.tab-btn')[2].classList.add('active');
                document.getElementById('pong-game').classList.add('active');
                startPong();
            }
        }

        // ================= ТЕТРИС =================
        function startTetris() {
            stopAllGames();
            const canvas = document.getElementById('tetris');
            const ctx = canvas.getContext('2d');
            const grid = 20;
            const rows = 20;
            const cols = 10;

            let board = Array(rows).fill().map(() => Array(cols).fill(0));
            let score = 0;
            document.getElementById('tetris-score').innerText = score;

            const shapes = [
                [[1, 1, 1, 1]], // I
                [[1, 1], [1, 1]], // O
                [[0, 1, 0], [1, 1, 1]], // T
                [[1, 0, 0], [1, 1, 1]], // L
                [[0, 0, 1], [1, 1, 1]], // J
                [[0, 1, 1], [1, 1, 0]], // S
                [[1, 1, 0], [0, 1, 1]]  // Z
            ];
            const colors = ['#38bdf8', '#facc15', '#a855f7', '#f97316', '#3b82f6', '#22c55e', '#ef4444'];

            let piece = getRandomPiece();

            function getRandomPiece() {
                const index = Math.floor(Math.random() * shapes.length);
                return {
                    shape: shapes[index],
                    color: colors[index],
                    x: Math.floor(cols / 2) - 1,
                    y: 0
                };
            }

            function draw() {
                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Отрисовка поля
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (board[r][c]) {
                            ctx.fillStyle = board[r][c];
                            ctx.fillRect(c * grid, r * grid, grid - 1, grid - 1);
                        }
                    }
                }

                // Отрисовка фигуры
                ctx.fillStyle = piece.color;
                piece.shape.forEach((row, r) => {
                    row.forEach((value, c) => {
                        if (value) {
                            ctx.fillRect((piece.x + c) * grid, (piece.y + r) * grid, grid - 1, grid - 1);
                        }
                    });
                });
            }

            function moveDown() {
                piece.y++;
                if (collide()) {
                    piece.y--;
                    merge();
                    clearRows();
                    piece = getRandomPiece();
                    if (collide()) {
                        alert('Игра окончена! Счет: ' + score);
                        startTetris();
                    }
                }
                draw();
            }

            function collide() {
21:25
return piece.shape.some((row, r) => {
                    return row.some((value, c) => {
                        let newX = piece.x + c;
                        let newY = piece.y + r;
                        return value && (newX < 0 || newX >= cols || newY >= rows || (newY >= 0 && board[newY][newX]));
                    });
                });
            }

            function merge() {
                piece.shape.forEach((row, r) => {
                    row.forEach((value, c) => {
                        if (value) board[piece.y + r][piece.x + c] = piece.color;
                    });
                });
            }

            function clearRows() {
                for (let r = rows - 1; r >= 0; r--) {
                    if (board[r].every(cell => cell !== 0)) {
                        board.splice(r, 1);
                        board.unshift(Array(cols).fill(0));
                        score += 100;
                        document.getElementById('tetris-score').innerText = score;
                    }
                }
            }

            window.onkeydown = (e) => {
                if (!document.getElementById('tetris-game').classList.contains('active')) return;
                if (e.key === 'ArrowLeft') { piece.x--; if (collide()) piece.x++; }
                if (e.key === 'ArrowRight') { piece.x++; if (collide()) piece.x--; }
                if (e.key === 'ArrowDown') { moveDown(); }
                if (e.key === 'ArrowUp') {
                    const rotated = piece.shape[0].map((_, i) => piece.shape.map(row => row[i]).reverse());
                    const prevShape = piece.shape;
                    piece.shape = rotated;
                    if (collide()) piece.shape = prevShape;
                }
                draw();
            };

            currentInterval = setInterval(moveDown, 500);
            draw();
        }

        // ================= ЗМЕЙКА =================
        function startSnake() {
            stopAllGames();
            const canvas = document.getElementById('snake');
            const ctx = canvas.getContext('2d');
            const grid = 15;
            const count = canvas.width / grid;

            let snake = [{x: 10, y: 10}];
            let food = {x: 5, y: 5};
            let dx = 1, dy = 0;
            let score = 0;
            document.getElementById('snake-score').innerText = score;

            function draw() {
                let head = {x: snake[0].x + dx, y: snake[0].y + dy};

                if (head.x < 0 || head.x >= count || head.y < 0 || head.y >= count || snake.some(s => s.x === head.x && s.y === head.y)) {
                    alert('Игра окончена! Ваш счет: ' + score);
                    startSnake();
                    return;
                }

                snake.unshift(head);

                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    document.getElementById('snake-score').innerText = score;
                    food = {Math: Math.floor(Math.random() * count), y: Math.floor(Math.random() * count)};
                } else {
                    snake.pop();
                }

                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#ef4444';
                ctx.fillRect(food.x * grid, food.y * grid, grid - 1, grid - 1);

                ctx.fillStyle = '#22c55e';
                snake.forEach(s => ctx.fillRect(s.x * grid, s.y * grid, grid - 1, grid - 1));
            }

            window.onkeydown = (e) => {
                if (!document.getElementById('snake-game').classList.contains('active')) return;
                if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
                if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
                if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
                if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
21:25
};

            currentInterval = setInterval(draw, 100);
        }

        // ================= ПОНГ =================
        function startPong() {
            stopAllGames();
            const canvas = document.getElementById('pong');
            const ctx = canvas.getContext('2d');

            let paddleH = 60, paddleW = 10;
            let playerY = canvas.height / 2 - paddleH / 2;
            let aiY = canvas.height / 2 - paddleH / 2;
            let ballX = canvas.width / 2, ballY = canvas.height / 2;
            let ballSpeedX = 3, ballSpeedY = 3;
            let playerScore = 0, aiScore = 0;

            canvas.onmousemove = (e) => {
                const rect = canvas.getBoundingClientRect();
                playerY = e.clientY - rect.top - paddleH / 2;
            };

            function draw() {
                ballX += ballSpeedX;
                ballY += ballSpeedY;

                // Отскок от верха/низа
                if (ballY <= 0 || ballY >= canvas.height) ballSpeedY = -ballSpeedY;

                // Движение ИИ
                if (aiY + paddleH / 2 < ballY - 10) aiY += 2.5;
                else if (aiY + paddleH / 2 > ballY + 10) aiY -= 2.5;

                // Столкновение с ракеткой игрока
                if (ballX <= paddleW && ballY >= playerY && ballY <= playerY + paddleH) {
                    ballSpeedX = -ballSpeedX;
                }

                // Столкновение с ракеткой ИИ
                if (ballX >= canvas.width - paddleW && ballY >= aiY && ballY <= aiY + paddleH) {
                    ballSpeedX = -ballSpeedX;
                }

                // Голы
                if (ballX < 0) {
                    aiScore++;
                    resetBall();
                } else if (ballX > canvas.width) {
                    playerScore++;
                    resetBall();
                }

                document.getElementById('pong-player').innerText = playerScore;
                document.getElementById('pong-ai').innerText = aiScore;

                ctx.fillStyle = '#090d16';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#38bdf8';
                ctx.fillRect(0, playerY, paddleW, paddleH);
                ctx.fillRect(canvas.width - paddleW, aiY, paddleW, paddleH);

                ctx.beginPath();
                ctx.arc(ballX, ballY, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            function resetBall() {
                ballX = canvas.width / 2;
                ballY = canvas.height / 2;
                ballSpeedX = -ballSpeedX;
            }

            currentInterval = setInterval(draw, 1000 / 60);
        }

        // Старт первой игры по умолчанию
        startTetris();
    </script>
</body>
</html>
