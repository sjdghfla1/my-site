        let currentCategory = 'all';

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const noResults = document.getElementById('noResults');
            
            grid.innerHTML = '';
            let count = 0;

            items.forEach(item => {
                const matchCategory = (currentCategory === 'all' || item.category === currentCategory);
                const matchSearch = item.name.toLowerCase().includes(searchVal) || 
                                    item.desc.toLowerCase().includes(searchVal) ||
                                    item.categoryLabel.toLowerCase().includes(searchVal);

                if (matchCategory && matchSearch) {
                    count++;
                    const badgeClass = `badge-${item.category}`;
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openModal(item);
                    card.innerHTML = `
                        <div class="card-img-container">
                            <img src="${item.img}" alt="${item.name}" class="card-img" referrerpolicy="no-referrer" loading="lazy">
                        </div>
                        <div class="card-body">
                            <span class="badge ${badgeClass}">${item.categoryLabel}</span>
                            <h2 class="card-title">${item.name}</h2>
                            <div class="card-years">${item.years}</div>
                            <p class="card-text">${item.desc}</p>
                            <div class="click-hint">Нажми, чтобы открыть биографию и тест ➔</div>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });

            noResults.style.display = count === 0 ? 'block' : 'none';
        }

        function setCategory(cat, event) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCards();
        }

        function filterData() {
            renderCards();
        }

        /* Modal & Quiz Functions */
        function openModal(item) {
            document.getElementById('mImg').src = item.img;
            document.getElementById('mName').textContent = item.name;
            document.getElementById('mYears').textContent = item.years;
            document.getElementById('mBio').innerHTML = item.bio;
            document.getElementById('mDiscoveries').innerHTML = item.discoveries;
            
            const badge = document.getElementById('mBadge');
            badge.textContent = item.categoryLabel;
            badge.className = `badge badge-${item.category}`;

            // Render Quiz
            document.getElementById('qQuestion').textContent = item.quiz.q;
            document.getElementById('qResult').textContent = '';
            
            const qOptions = document.getElementById('qOptions');
            qOptions.innerHTML = '';

            item.quiz.options.forEach((optText, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.textContent = optText;
                btn.onclick = () => checkQuiz(btn, index, item.quiz.correct);
                qOptions.appendChild(btn);
            });

            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function closeModalOnOverlay(e) {
            if (e.target.id === 'modalOverlay') {
                closeModal();
            }
        }

        function checkQuiz(selectedBtn, selectedIndex, correctIndex) {
            const buttons = document.querySelectorAll('.quiz-btn');
            buttons.forEach(btn => btn.disabled = true);

            const resultDiv = document.getElementById('qResult');

            if (selectedIndex === correctIndex) {
                selectedBtn.classList.add('correct');
                resultDiv.style.color = '#22c55e';
                resultDiv.textContent = '🎉 Верно! Отличный ответ!';
            } else {
                selectedBtn.classList.add('wrong');
                buttons[correctIndex].classList.add('correct');
                resultDiv.style.color = '#ef4444';
                resultDiv.textContent = '❌ Неверно! Правильный ответ подсвечен зеленым.';
            }
        }

        renderCards();
    </script>
