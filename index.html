<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Великие деятели и стили XVIII века</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            max-width: 1100px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        /* Profile Bar */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }
        .user-widget {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid #334155;
            cursor: pointer;
            transition: all 0.2s;
        }
        .user-widget:hover {
            border-color: #38bdf8;
            background: #334155;
        }
        .user-avatar {
            font-size: 20px;
            background: #0f172a;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .user-name {
            font-weight: 600;
            font-size: 14px;
            color: #38bdf8;
        }

        h1 { color: #38bdf8; font-size: 28px; margin-bottom: 4px; }
        .author { color: #f59e0b; font-size: 15px; font-weight: 600; }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 25px;
            align-items: center;
        }

        .search-box {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .search-box:focus { border-color: #38bdf8; }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: #334155; color: #fff; }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }
        .tab-btn.fav-tab.active {
            background: #f59e0b;
            color: #0f172a;
            border-color: #f59e0b;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: #1e293b;
            border-radius: 14px;
            border: 1px solid #334155;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border-color: #38bdf8;
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid #334155;
            color: #94a3b8;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            z-index: 5;
            transition: all 0.2s;
        }
        .fav-btn:hover { scale: 1.1; color: #f59e0b; }
        .fav-btn.active { color: #f59e0b; background: #0f172a; border-color: #f59e0b; }

        .card-img-container {
            width: 100%;
            height: 220px;
            background: #090d16;
            overflow: hidden;
            position: relative;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .badge {
            align-self: flex-start;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .badge-scientist { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .badge-artist { background: rgba(236, 72, 153, 0.2); color: #ec4899; }
        .badge-writer { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .badge-style { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }

        .card-title {
            font-size: 18px;
            color: #f8fafc;
            margin-bottom: 4px;
        }
        .card-years {
            font-size: 13px;
            color: #facc15;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .card-text {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .click-hint {
            margin-top: 12px;
            font-size: 12px;
            color: #38bdf8;
            font-weight: 600;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #1e293b;
            color: #f8fafc;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 16px;
            padding: 28px;
            border: 1px solid #334155;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #94a3b8;
            line-height: 1;
        }
        .close-btn:hover { color: #fff; }

        .modal-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: flex-start;
        }
        .modal-img {
            width: 150px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #334155;
            flex-shrink: 0;
        }
        .modal-title-area h2 { font-size: 26px; color: #38bdf8; margin-bottom: 6px; }
        .modal-title-area .years { color: #facc15; font-size: 15px; margin-bottom: 10px; font-weight: 600; }

        .modal-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }
        .btn-fav-modal {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .btn-fav-modal.active {
            background: #f59e0b;
            color: #0f172a;
            border-color: #f59e0b;
        }

        .section-title {
            font-size: 18px;
            color: #f59e0b;
            margin: 22px 0 10px 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
        }
        .modal-bio, .modal-discoveries {
            font-size: 15px;
            line-height: 1.7;
            color: #cbd5e1;
        }

        /* Profile Modal Form */
        .profile-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 600;
        }
        .form-input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .form-input:focus { border-color: #38bdf8; }
        .avatar-picker {
            display: flex;
            gap: 12px;
        }
        .avatar-option {
            font-size: 24px;
            padding: 8px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-option.selected {
            border-color: #38bdf8;
            background: #1e293b;
            scale: 1.1;
        }

        .btn-submit {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #0284c7; color: #fff; }
        
        .btn-logout {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-logout:hover { background: #dc2626; }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: #94a3b8;
            padding: 20px;
            font-size: 16px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div style="flex-grow: 1;"></div>
            <div class="user-widget" id="userWidget" onclick="openProfileModal()">
                <!-- Populated dynamically -->
            </div>
        </div>
        <h1>📚 Великие деятели и стили XVIII века</h1>
        <div class="author">Этот сайт сделал Дима Усынин</div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Поиск по имени или описанию..." oninput="filterData()">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="setCategory('all', event)">Все (20)</button>
            <button class="tab-btn" onclick="setCategory('scientist', event)">Учёные</button>
            <button class="tab-btn" onclick="setCategory('artist', event)">Художники</button>
            <button class="tab-btn" onclick="setCategory('writer', event)">Писатели и Драматурги</button>
            <button class="tab-btn" onclick="setCategory('style', event)">Стили</button>
            <button class="tab-btn fav-tab" onclick="setCategory('favorites', event)">⭐ Избранное (<span id="favCount">0</span>)</button>
        </div>
    </div>

    <div class="grid" id="cardsGrid"></div>
    <div id="noResults" class="no-results">Ничего не найдено</div>

    <!-- Item Detail Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event, 'modalOverlay')">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modalOverlay')">&times;</span>
            <div class="modal-header">
                <img id="mImg" src="" alt="" class="modal-img">
                <div class="modal-title-area">
                    <span id="mBadge" class="badge"></span>
                    <h2 id="mName"></h2>
                    <div id="mYears" class="years"></div>
                    <div class="modal-actions">
                        <button id="mFavBtn" class="btn-fav-modal" onclick="toggleFavoriteCurrent()">
                            ⭐ <span id="mFavText">В избранное</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="section-title">📖 Подробная биография</div>
            <p id="mBio" class="modal-bio"></p>

            <div class="section-title">💡 Достижения и историческое наследие</div>
            <p id="mDiscoveries" class="modal-discoveries"></p>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal-overlay" id="profileModal" onclick="closeModalOnOverlay(event, 'profileModal')">
        <div class="modal-content" style="max-width: 450px;">
            <span class="close-btn" onclick="closeModal('profileModal')">&times;</span>
            <h2 style="color: #38bdf8; margin-bottom: 10px;">👤 Профиль пользователя</h2>
            <p style="color: #94a3b8; font-size: 14px;">Данные профиля сохраняются в вашем браузере.</p>

            <form class="profile-form" onsubmit="saveProfile(event)">
                <div class="form-group">
                    <label>Ваше имя или никнейм:</label>
                    <input type="text" id="profileNameInput" class="form-input" placeholder="Введите имя..." required maxlength="25">
                </div>

                <div class="form-group">
                    <label>Выберите аватарку:</label>
                    <div class="avatar-picker" id="avatarPicker">
                        <div class="avatar-option selected" onclick="selectAvatar('🏛️', this)">🏛️</div>
                        <div class="avatar-option" onclick="selectAvatar('📜', this)">📜</div>
                        <div class="avatar-option" onclick="selectAvatar('🎨', this)">🎨</div>
                        <div class="avatar-option" onclick="selectAvatar('🔬', this)">🔬</div>
                        <div class="avatar-option" onclick="selectAvatar('👑', this)">👑</div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Сохранить профиль</button>
            </form>

            <div id="logoutSection" style="display: none; border-top: 1px solid #334155; margin-top: 20px; padding-top: 15px;">
                <button type="button" class="btn-logout" onclick="logoutProfile()">Сбросить профиль</button>
            </div>
        </div>
    </div>

    <script>
        const items = [
            // --- УЧЁНЫЕ ---
            {
                id: 1,
                name: "Братья Монгольфье",
                category: "scientist",
                categoryLabel: "Учёные / Изобретатели",
                years: "Жозеф (1740–1810) и Этьенн (1745–1799)",
                img: "https://upload.wikimedia.org/wikipedia/commons/c/c8/Montgolfier_brothers.png",
                desc: "Французские изобретатели, создатели первого в мире действующего теплового аэростата.",
                bio: "Жозеф-Мишель и Жак-Этьенн Монгольфье родились во Франции в многодетной семье владельца крупной бумажной фабрики. Жозеф обладал неординарным изобретательским умом, а Этьенн отличался предпринимательской жилкой. В 1782 году Жозеф заметил, как нагретый воздух поднимает лёгкую бумажную оболочку над очагом, и предложил брату сконструировать крупный шар. <br><br>В июне 1783 года в Анноне они провели первый публичный запуск льняного шара, обклеенного бумагой. В сентябре того же года в Версале в присутствии Людовика XVI и Марии-Антуанетты они запустили аэростат с первыми живыми пассажирами — овцой, петухом и утицей. Спустя два месяца состоялся первый исторический полёт человека на монгольфьере (Пилатр де Розье и маркиз д'Арланд), что положило начало мировой воздухоплавательной эре.",
                discoveries: "• Изобретение и практическое воплощение конструкции горячего теплового аэростата (монгольфьера).<br>• Разработка гидравлического тарана — устройства для подъёма воды за счёт энергии гидроудара.<br>• Совершенствование бумагоделательных технологий, включая производство веленевой бумаги."
            },
            {
                id: 2,
                name: "Карл Линней",
                category: "scientist",
                categoryLabel: "Учёные",
                years: "1707 — 1778",
                img: "https://upload.wikimedia.org/wikipedia/commons/6/68/Carl_von_Linn%C3%A9.jpg",
                desc: "Шведский естествоиспытатель, создатель единой биноминальной системы классификации животного и растительного мира.",
                bio: "Карл Линней родился в семье деревенского священника на юге Швеции. С самых ранних лет проявлял страстную любовь к ботанике, за что в школе получил прозвище «маленький ботаник». Окончил Уппсальский университет, где позже стал профессором и ректором. В 1732 году совершил одиночную научную экспедицию в Лапландию, где собрал уникальный гербарий и этнографические материалы.<br><br>Линней посвятил жизнь систематизации всех известных науке живых организмов. Его фундаментальный труд «Systema Naturae» («Система природы»), выдержавший при жизни автора 12 изданий, упорядочил весь хаос естествознания XVIII века. За выдающиеся заслуги перед наукой король Швеции возвёл Линнея в дворянское достоинство.",
                discoveries: "• Введение биноминальной номенклатуры — двойных латинских названий (род + вид), используемых в биологии по сей день.<br>• Систематизация известной флоры и фауны (описал свыше 10 000 видов растений и 4 400 видов животных).<br>• Выделение человека в отряд приматов и присвоение ему наименования Homo sapiens."
            },
            {
                id: 3,
                name: "Пьер-Симон Лаплас",
                category: "scientist",
                categoryLabel: "Учёные",
                years: "1749 — 1827",
                img: "https://upload.wikimedia.org/wikipedia/commons/3/3d/Pierre-Simon_Laplace.jpg",
                desc: "Французский математик, физик и астроном, один из создателей теории вероятностей и небесной механики.",
                bio: "Пьер-Симон Лаплас родился в Нормандии в семье крестьянина, однако благодаря поддержке состоятельных соседей смог получить отличное образование. В 19 лет отправился в Париж, где благодаря рекомендации Жана Д'Аламбера получил должность профессора Военной школы.<br><br>Лаплас проявил себя как выдающийся математик и астроном, доказав устойчивость Солнечной системы. В период Французской революции занимал должность министра внутренних дел, а при Наполеоне стал графом империи и сенатором. Написал фундаментальный 5-томный труд «Трактат о небесной механике», где полностью описал движение планет и их спутников на основе закона всемирного тяготения.",
                discoveries: "• Разработка космогонической гипотезы образования Солнечной системы из вращающейся газовой туманности.<br>• Введение математического уравнения Лапласа и оператора Лапласа в математической физике.<br>• Развитие теории вероятностей, формализация метода наименьших квадратов и теоремы Bayes-Laplace."
            },
            {
                id: 4,
                name: "Леонард Эйлер",
                category: "scientist",
                categoryLabel: "Учёные",
                years: "1707 — 1783",
                img: "https://upload.wikimedia.org/wikipedia/commons/d/d7/Leonhard_Euler.jpg",
                desc: "Швейцарский, немецкий и российский математик, написавший свыше 850 фундаментальных научных работ.",
                bio: "Леонард Эйлер родился в Базеле (Швейцария), но значительную часть своей жизни провёл в России, работая в Петербургской академии наук. Эйлер отличался невероятной работоспособностью и феноменальной памятью. В 1735 году из-за переутомления он потерял зрение на правый глаз, а к 1766 году полностью ослеп, но продолжал диктовать сложнейшие математические расчеты своим сыновьям и ученикам.<br><br>Его труды охватывают почти все разделы математики своего времени: математический анализ, геометрию, теорию чисел, механику, оптику и астрономию. Именно Эйлер создал современную математическую символику и заложил основы высшего анализа.",
                discoveries: "• Создание теории графов (знаменитая задача о семи Кенигсбергских мостах).<br>• Введение современной математической нотации: f(x), основания натурального логарифма e, мнимой единицы i, знака суммы Σ.<br>• Формула Эйлера, связывающая тригонометрию и комплексные числа: e^(ix) = cos(x) + i*sin(x)."
            },
            {
                id: 5,
                name: "Жозеф-Луи Лагранж",
                category: "scientist",
                categoryLabel: "Учёные",
