<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Исторические личности и культура (5–11 класс)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
            max-width: 1100px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Profile Bar */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }
        .user-widget {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1e293b;
            padding: 8px 14px;
            border-radius: 30px;
            border: 1px solid #334155;
            cursor: pointer;
            transition: all 0.2s;
        }
        .user-widget:hover {
            border-color: #38bdf8;
            background: #334155;
        }
        .user-avatar {
            font-size: 20px;
            background: #0f172a;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        .user-name {
            font-weight: 600;
            font-size: 14px;
            color: #38bdf8;
        }

        h1 { color: #38bdf8; font-size: 26px; margin-bottom: 4px; }
        .author { color: #f59e0b; font-size: 15px; font-weight: 600; }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 25px;
            align-items: center;
            background: #1e293b;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .search-box:focus { border-color: #38bdf8; }

        .filters-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .filter-select {
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .filter-select:focus { border-color: #38bdf8; }

        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: #0f172a;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: #334155; color: #fff; }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }
        .tab-btn.fav-tab.active {
            background: #f59e0b;
            color: #0f172a;
            border-color: #f59e0b;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: #1e293b;
            border-radius: 14px;
            border: 1px solid #334155;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            border-color: #38bdf8;
        }

        .fav-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid #334155;
            color: #94a3b8;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            z-index: 5;
            transition: all 0.2s;
        }
        .fav-btn:hover { scale: 1.1; color: #f59e0b; }
        .fav-btn.active { color: #f59e0b; background: #0f172a; border-color: #f59e0b; }

        .card-img-container {
            width: 100%;
            height: 220px;
            background: #090d16;
            overflow: hidden;
            position: relative;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .badges-line {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .badge-grade { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .badge-century { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .badge-scientist { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
        .badge-artist { background: rgba(236, 72, 153, 0.15); color: #ec4899; }
        .badge-writer { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .badge-leader { background: rgba(34, 197, 94, 0.15); color: #4ade80; }

        .card-title {
            font-size: 18px;
            color: #f8fafc;
            margin-bottom: 4px;
        }
        .card-years {
            font-size: 13px;
            color: #facc15;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .card-text {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.5;
        }
        .click-hint {
            margin-top: auto;
            padding-top: 12px;
            font-size: 12px;
            color: #38bdf8;
            font-weight: 600;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #1e293b;
            color: #f8fafc;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 16px;
            padding: 28px;
            border: 1px solid #334155;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .close-btn {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #94a3b8;
            line-height: 1;
        }
        .close-btn:hover { color: #fff; }

        .modal-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: flex-start;
        }
        .modal-img {
            width: 150px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #334155;
            flex-shrink: 0;
        }
        .modal-title-area h2 { font-size: 26px; color: #38bdf8; margin-bottom: 6px; }
        .modal-title-area .years { color: #facc15; font-size: 15px; margin-bottom: 10px; font-weight: 600; }

        .btn-fav-modal {
            background: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .btn-fav-modal.active {
            background: #f59e0b;
            color: #0f172a;
            border-color: #f59e0b;
        }

        .section-title {
            font-size: 18px;
            color: #f59e0b;
            margin: 22px 0 10px 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 6px;
        }
        .modal-bio, .modal-discoveries {
            font-size: 15px;
            line-height: 1.7;
            color: #cbd5e1;
        }

        /* Profile Modal Form */
        .profile-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 600;
        }
        .form-input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .form-input:focus { border-color: #38bdf8; }
        .avatar-picker {
            display: flex;
            gap: 12px;
        }
        .avatar-option {
            font-size: 24px;
            padding: 8px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar-option.selected {
            border-color: #38bdf8;
            background: #1e293b;
            scale: 1.1;
        }

        .btn-submit {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            margin-top: 10px;
        }
        .btn-submit:hover { background: #0284c7; color: #fff; }
        
        .btn-logout {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-logout:hover { background: #dc2626; }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: #94a3b8;
            padding: 30px;
            font-size: 16px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <div style="flex-grow: 1;"></div>
            <div class="user-widget" id="userWidget" onclick="openProfileModal()"></div>
        </div>
        <h1>🏛️ Исторические личности по истории (5–11 класс)</h1>
        <div class="author">Этот сайт сделал Дима Усынин</div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Поиск по имени, понятию или описанию..." oninput="filterData()">
        
        <div class="filters-group">
            <!-- Grade Filter -->
            <select id="gradeSelect" class="filter-select" onchange="filterData()">
                <option value="all">🎓 Все классы (5–11)</option>
                <option value="5">5 класс — Древний мир</option>
                <option value="6">6 класс — Средние века / Русь</option>
                <option value="7">7 класс — XVI–XVII века</option>
                <option value="8">8 класс — XVIII век</option>
                <option value="9">9 класс — XIX век</option>
                <option value="10">10 класс — Конец XIX – середина XX в.</option>
                <option value="11">11 класс — Вторая половина XX – XXI в.</option>
            </select>

            <!-- Century Filter -->
            <select id="centurySelect" class="filter-select" onchange="filterData()">
                <option value="all">⏳ Все века</option>
                <option value="ancient">До н.э. — V в. н.э.</option>
                <option value="6-15">VI — XV века</option>
                <option value="16-17">XVI — XVII века</option>
                <option value="18">XVIII век</option>
                <option value="19">XIX век</option>
                <option value="20-21">XX — XXI века</option>
            </select>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="setCategory('all', event)">Все роли</button>
            <button class="tab-btn" onclick="setCategory('scientist', event)">🔬 Учёные и Изобретатели</button>
            <button class="tab-btn" onclick="setCategory('artist', event)">🎨 Художники и Архитекторы</button>
            <button class="tab-btn" onclick="setCategory('writer', event)">📖 Писатели и Поэты</button>
            <button class="tab-btn" onclick="setCategory('leader', event)">👑 Деятели культуры и политики</button>
            <button class="tab-btn fav-tab" onclick="setCategory('favorites', event)">⭐ Избранное (<span id="favCount">0</span>)</button>
        </div>
    </div>

    <div class="grid" id="cardsGrid"></div>
    <div id="noResults" class="no-results">По вашему запросу ничего не найдено 🔍</div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event, 'modalOverlay')">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modalOverlay')">&times;</span>
            <div class="modal-header">
                <img id="mImg" src="" alt="" class="modal-img">
                <div class="modal-title-area">
                    <div class="badges-line">
                        <span id="mGradeBadge" class="badge badge-grade"></span>
                        <span id="mCenturyBadge" class="badge badge-century"></span>
                    </div>
                    <h2 id="mName"></h2>
                    <div id="mYears" class="years"></div>
                    <button id="mFavBtn" class="btn-fav-modal" onclick="toggleFavoriteCurrent()">
                        ⭐ <span id="mFavText">В избранное</span>
                    </button>
                </div>
            </div>

            <div class="section-title">📖 Подробная биография и контекст</div>
            <p id="mBio" class="modal-bio"></p>

            <div class="section-title">💡 Вклад в культуру, науку и историю</div>
            <p id="mDiscoveries" class="modal-discoveries"></p>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal-overlay" id="profileModal" onclick="closeModalOnOverlay(event, 'profileModal')">
        <div class="modal-content" style="max-width: 450px;">
            <span class="close-btn" onclick="closeModal('profileModal')">&times;</span>
            <h2 style="color: #38bdf8; margin-bottom: 10px;">👤 Профиль пользователя</h2>
            <p style="color: #94a3b8; font-size: 14px;">Данные сохраняются при закрытии сайта.</p>

            <form class="profile-form" onsubmit="saveProfile(event)">
                <div class="form-group">
                    <label>Ваше имя или никнейм:</label>
                    <input type="text" id="profileNameInput" class="form-input" placeholder="Введите имя..." required maxlength="25">
                </div>

                <div class="form-group">
                    <label>Выберите аватарку:</label>
                    <div class="avatar-picker" id="avatarPicker">
                        <div class="avatar-option selected" onclick="selectAvatar('🏛️', this)">🏛️</div>
                        <div class="avatar-option" onclick="selectAvatar('📜', this)">📜</div>
                        <div class="avatar-option" onclick="selectAvatar('🎨', this)">🎨</div>
                        <div class="avatar-option" onclick="selectAvatar('🔬', this)">🔬</div>
                        <div class="avatar-option" onclick="selectAvatar('👑', this)">👑</div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Сохранить профиль</button>
            </form>

            <div id="logoutSection" style="display: none; border-top: 1px solid #334155; margin-top: 20px; padding-top: 15px;">
                <button type="button" class="btn-logout" onclick="logoutProfile()">Сбросить профиль</button>
            </div>
        </div>
    </div>

    <script>

        // State Management
        let currentCategory = 'all';
        let currentOpenItemId = null;
        let selectedAvatar = '🏛️';

        let userProfile = JSON.parse(localStorage.getItem('history_userProfile')) || null;
        let favorites = JSON.parse(localStorage.getItem('history_favorites')) || [];

        function init() {
            updateUserWidget();
            updateFavCount();
            renderCards();
        }

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const gradeVal = document.getElementById('gradeSelect').value;
            const centuryVal = document.getElementById('centurySelect').value;
            const noResults = document.getElementById('noResults');
            
            grid.innerHTML = '';
            let count = 0;

            items.forEach(item => {
                const isFav = favorites.includes(item.id);
                
                // Category Filter
                let matchCategory = false;
                if (currentCategory === 'all') matchCategory = true;
                else if (currentCategory === 'favorites') matchCategory = isFav;
                else matchCategory = (item.category === currentCategory);

                // Grade Filter
                let matchGrade = (gradeVal === 'all' || item.grade === gradeVal);

                // Century Filter
                let matchCentury = (centuryVal === 'all' || item.centuryKey === centuryVal);

                // Search Filter
                const matchSearch = item.name.toLowerCase().includes(searchVal) || 
                                    item.desc.toLowerCase().includes(searchVal) ||
                                    item.categoryLabel.toLowerCase().includes(searchVal) ||
                                    item.years.toLowerCase().includes(searchVal);

                if (matchCategory && matchGrade && matchCentury && matchSearch) {
                    count++;
                    const badgeClass = `badge-${item.category}`;
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openModal(item);
                    card.innerHTML = `
                        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${item.id}, event)" title="В избранное">⭐</button>
                        <div class="card-img-container">
                            <img src="${item.img}" alt="${item.name}" class="card-img" referrerpolicy="no-referrer" loading="lazy">
                        </div>
                        <div class="card-body">
                            <div class="badges-line">
                                <span class="badge badge-grade">${item.grade} класс</span>
                                <span class="badge badge-century">${item.centuryLabel}</span>
                                <span class="badge ${badgeClass}">${item.categoryLabel}</span>
                            </div>
                            <h2 class="card-title">${item.name}</h2>
                            <div class="card-years">${item.years}</div>
                            <p class="card-text">${item.desc}</p>
                            <div class="click-hint">Открыть биографию ➔</div>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });

            noResults.style.display = count === 0 ? 'block' : 'none';
        }

        function setCategory(cat, event) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCards();
        }

        function filterData() {
            renderCards();
        }

        /* Favorites Logic */
        function toggleFav(id, e) {
            if (e) e.stopPropagation();
            const idx = favorites.indexOf(id);
            if (idx > -1) {
                favorites.splice(idx, 1);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('history_favorites', JSON.stringify(favorites));
            updateFavCount();
            renderCards();

            if (currentOpenItemId === id) {
                updateModalFavBtn(id);
            }
        }

        function toggleFavoriteCurrent() {
            if (currentOpenItemId) {
                toggleFav(currentOpenItemId, null);
            }
        }

        function updateFavCount() {
            document.getElementById('favCount').textContent = favorites.length;
        }

        function updateModalFavBtn(id) {
            const isFav = favorites.includes(id);
            const favBtn = document.getElementById('mFavBtn');
            const favText = document.getElementById('mFavText');
            if (isFav) {
                favBtn.classList.add('active');
                favText.textContent = 'В избранном';
            } else {
                favBtn.classList.remove('active');
                favText.textContent = 'В избранное';
            }
        }

        /* Item Modal Functions */
        function openModal(item) {
            currentOpenItemId = item.id;
            document.getElementById('mImg').src = item.img;
            document.getElementById('mName').textContent = item.name;
            document.getElementById('mYears').textContent = item.years;
            document.getElementById('mBio').innerHTML = item.bio;
            document.getElementById('mDiscoveries').innerHTML = item.discoveries;
            
            document.getElementById('mGradeBadge').textContent = `${item.grade} класс`;
            document.getElementById('mCenturyBadge').textContent = item.centuryLabel;

            updateModalFavBtn(item.id);

            document.getElementById('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        /* Profile System */
        function updateUserWidget() {
            const widget = document.getElementById('userWidget');
            if (userProfile && userProfile.name) {
                widget.innerHTML = `
                    <div class="user-avatar">${userProfile.avatar || '🏛️'}</div>
                    <div class="user-name">${userProfile.name}</div>
                `;
            } else {
                widget.innerHTML = `
                    <div class="user-avatar">👤</div>
                    <div class="user-name">Войти / Профиль</div>
                `;
            }
        }

        function openProfileModal() {
            const nameInput = document.getElementById('profileNameInput');
            const logoutSec = document.getElementById('logoutSection');

            if (userProfile && userProfile.name) {
                nameInput.value = userProfile.name;
                selectAvatar(userProfile.avatar || '🏛️');
                logoutSec.style.display = 'block';
            } else {
                nameInput.value = '';
                selectAvatar('🏛️');
                logoutSec.style.display = 'none';
            }

            document.getElementById('profileModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function selectAvatar(emoji, el) {
            selectedAvatar = emoji;
            const options = document.querySelectorAll('.avatar-option');
            options.forEach(opt => {
                opt.classList.remove('selected');
                if (opt.textContent === emoji) opt.classList.add('selected');
            });
            if (el) el.classList.add('selected');
        }

        function saveProfile(e) {
            e.preventDefault();
            const name = document.getElementById('profileNameInput').value.trim();
            if (!name) return;

            userProfile = {
                name: name,
                avatar: selectedAvatar
            };

            localStorage.setItem('history_userProfile', JSON.stringify(userProfile));
            updateUserWidget();
            closeModal('profileModal');
        }

        function logoutProfile() {
            userProfile = null;
            localStorage.removeItem('history_userProfile');
            updateUserWidget();
            closeModal('profileModal');
        }

        /* Modal Helpers */
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
            document.body.style.overflow = 'auto';
            if (modalId === 'modalOverlay') currentOpenItemId = null;
        }

        function closeModalOnOverlay(e, modalId) {
            if (e.target.id === modalId) {
                closeModal(modalId);
            }
        }

        // Initialize App
        init();
    </script>
</body>
</html>
