<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Великие деятели и стили XVIII века</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 25px;
            max-width: 800px;
        }
        h1 { color: #38bdf8; font-size: 28px; margin-bottom: 8px; }
        .author { color: #f59e0b; font-size: 15px; font-weight: 600; margin-bottom: 15px; }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 25px;
            align-items: center;
        }

        .search-box {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .search-box:focus { border-color: #38bdf8; }

        .tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .tab-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab-btn:hover { background: #334155; color: #fff; }
        .tab-btn.active {
            background: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: #1e293b;
            border-radius: 14px;
            border: 1px solid #334155;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        .card-img-container {
            width: 100%;
            height: 220px;
            background: #090d16;
            overflow: hidden;
            position: relative;
        }
        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .badge {
            align-self: flex-start;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .badge-scientist { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
        .badge-artist { background: rgba(236, 72, 153, 0.2); color: #ec4899; }
        .badge-writer { background: rgba(168, 85, 247, 0.2); color: #c084fc; }
        .badge-style { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }

        .card-title {
            font-size: 18px;
            color: #f8fafc;
            margin-bottom: 4px;
        }
        .card-years {
            font-size: 13px;
            color: #facc15;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .card-text {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: #94a3b8;
            padding: 20px;
            font-size: 16px;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 Великие деятели и стили XVIII века</h1>
        <div class="author">Этот сайт сделал Дима Усынин</div>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Поиск по имени или описанию..." oninput="filterData()">
        
        <div class="tabs">
            <button class="tab-btn active" onclick="setCategory('all', event)">Все (20)</button>
            <button class="tab-btn" onclick="setCategory('scientist', event)">Учёные</button>
            <button class="tab-btn" onclick="setCategory('artist', event)">Художники</button>
            <button class="tab-btn" onclick="setCategory('writer', event)">Писатели и Драматурги</button>
            <button class="tab-btn" onclick="setCategory('style', event)">Стили</button>
        </div>
    </div>

    <div class="grid" id="cardsGrid"></div>
    <div id="noResults" class="no-results">Ничего не найдено</div>

    <script>
        const items = [
            // --- УЧЁНЫЕ ---
            {
                name: "Братья Монгольфье",
                category: "scientist",
                categoryLabel: "Учёные / Изобретатели",
                years: "Жозеф (1740–1810) и Этьенн (1745–1799)",
                img: "https://upload.wikimedia.org/wikipedia/commons/c/c8/Montgolfier_brothers.png",
                desc: "Французские изобретатели, создатели воздушного шара (монгольфьера). В 1783 году совершили первый в истории запуск аэростата с людьми на борту."
            },
            {
                name: "Карл Линней",

                desc: "Шведский естествоиспытатель и врач. Создал единую систему классификации растительного и животного мира (биноминальную номенклатуру)."
            },
            {
                name: "Пьер-Симон Лаплас",
                category: "scientist",
                categoryLabel: "Учёные",
                years: "1749 — 1827",
                img: "https://upload.wikimedia.org/wikipedia/commons/3/3d/Pierre-Simon_Laplace.jpg",
                desc: "Французский математик, физик и астроном. Автор фундаментальных трудов по небесной механике, теории вероятностей и дифференциальным уравнениям."
            },
            {
                name: "Леонард Эйлер",
                category: "scientist",
                categoryLabel: "Учёные",
                years: "1707 — 1783",
                img: "https://upload.wikimedia.org/wikipedia/commons/d/d7/Leonhard_Euler.jpg",
                desc: "Выдающийся швейцарский, немецкий и российский математик и механик. Внёс определяющий вклад в математический анализ, теорию чисел и графов."
            },
            {
                name: "Жозеф-Луи Лагранж",
                category: "scientist",
                categoryLabel: "Учёные",
                years: "1736 — 1813",
                img: "https://upload.wikimedia.org/wikipedia/commons/d/d2/Lagrange_portrait.jpg",
                desc: "Французский математик и астроном. Создал аналитическую механику, заложил основы вариационного исчисления и сформулировал метод Лагранжа."
            },
            {
                name: "Антуан Лоран Лавуазье",
                category: "scientist",
                categoryLabel: "Учёные",
                years: "1743 — 1794",
                img: "https://upload.wikimedia.org/wikipedia/commons/6/6c/Antoine_lavoisier.jpg",
                desc: "Основатель современной химии. Доказал роль кислорода в процессах горения и дыхания, сформулировал закон сохранения массы веществ."
            },
            {
                name: "Клод-Луи Бертолле",
                category: "scientist",
                categoryLabel: "Учёные",
                years: "1748 — 1822",
                img: "https://upload.wikimedia.org/wikipedia/commons/c/c5/Claude_Louis_Berthollet.jpg",
                desc: "Французский химик. Открыл белильную (бертоллетову) соль, исследовал химическое равновесие, свойства аммиака и гремучего серебра."
            },
            {
                name: "Адам Смит",
                category: "scientist",
                categoryLabel: "Учёные / Экономисты",
                years: "1723 — 1790",
                img: "https://upload.wikimedia.org/wikipedia/commons/4/43/Adam_Smith_The_Muir_portrait.jpg",
                desc: "Шотландский экономист и философ, основоположник современной экономической теории. Автор классического труда «Исследование о природе и причинах богатства народов»."
            },

            // --- ХУДОЖНИКИ ---
            {
                name: "Антуан Ватто",
                category: "artist",
                categoryLabel: "Художники",
                years: "1684 — 1721",
                img: "https://upload.wikimedia.org/wikipedia/commons/1/14/Jean-Antoine_Watteau_-_Self-Portrait_-_WGA25453.jpg",
                desc: "Французский живописец и график, основоположник стиля рококо. Создатель жанра «галантных празднеств» в европейской живописи."
            },
            {
                name: "Жак-Луи Давид",
                category: "artist",
                categoryLabel: "Художники",
                years: "1748 — 1825",
                img: "https://upload.wikimedia.org/wikipedia/commons/7/70/Jacques-Louis_David_Self-Portrait.jpg",
                desc: "Французский живописец, основоположник французского неоклассицизма. Автор шедевров «Клятва Горациев», «Смерть Марата» и «Похищение сабинянок»."
            },

            // --- ПИСАТЕЛИ И ДРАМАТУРГИ ---
            {
                name: "Даниель Дефо",
                category: "writer",
                categoryLabel: "Писатели",
                years: "1660 — 1731",
                img: "https://upload.wikimedia.org/wikipedia/commons/0/02/Daniel_Defoe_Kneller_Style.jpg",
                desc: "Английский писатель и публицист, один из зачинателей европейского реалистического романа. Всемирно известен романом о «Робинзоне Крузо»."
            },
            {
                name: "Джонатан Свифт",
                category: "writer",
                categoryLabel: "Писатели",
                years: "1667 — 1745",
                img: "https://upload.wikimedia.org/wikipedia/commons/d/d7/Jonathan_swift.jpg",
                desc: "Англо-ирландский писатель-сатирик, философ и поэт. Автор бессмертной тетралогии «Путешествия Гулливера»."
            },
            {
                name: "Пьер Бомарше",
                category: "writer",
                categoryLabel: "Драматурги",
                years: "1732 — 1799",
                img: "https://upload.wikimedia.org/wikipedia/commons/3/3d/Beaumarchais-Perronneau.jpg",
                desc: "Французский драматург и публицист. Автор комедий «Севильский цирюльник» и «Женитьба Фигаро», вошедших в золотой фонд мирового театра."
            },
            {
                name: "Карло Гольдони",
                category: "writer",
                categoryLabel: "Драматурги",
                years: "1707 — 1793",
                img: "https://upload.wikimedia.org/wikipedia/commons/4/41/Carlo_Goldoni_by_Alessandro_Longhi.jpg",
                desc: "Итальянский драматург, реформатор итальянского театра. Автор пьес «Слуга двух господ» (Труффальдино из Бергамо) и «Трактирщица»."
            },
            {
                name: "Карло Гоцци",
                category: "writer",
                categoryLabel: "Драматурги",
                years: "1720 — 1806",
                img: "https://upload.wikimedia.org/wikipedia/commons/d/d6/Carlo_Gozzi.jpg",
                desc: "Итальянский писатель и драматург, создатель жанра театральной сказки (фьябы). Автор известных пьес «Любовь к трём апельсинам» и «Турандот»."
            },

            // --- СТИЛИ ---
            {
                name: "Барокко",
                category: "style",
                categoryLabel: "Архитектурный стиль",
                years: "XVII — XVIII века",
                img: "https://upload.wikimedia.org/wikipedia/commons/d/d3/St_Peter%27s_Square%2C_Vatican_City_-_Sat_Jan_2007.jpg",
                desc: "Стиль, отличающийся пышностью, контрастностью, динамичностью образов, стремлением к величию, богатой лепнине и позолоте."
            },
            {
                name: "Рококо",
                category: "style",
                categoryLabel: "Архитектурный стиль",
                years: "XVIII век",
                img: "https://upload.wikimedia.org/wikipedia/commons/e/e4/Amalienburg_Spiegelsaal.jpg",
                desc: "Изящный и легкий стиль, отличающийся декоративностью, грациозным орнаментом в виде раковин (рокайль) и пастельной цветовой гаммой."
            },
            {
                name: "Классицизм",
                category: "style",
                categoryLabel: "Архитектурный стиль",
                years: "XVIII — начало XIX века",
                img: "https://upload.wikimedia.org/wikipedia/commons/0/0c/Pantheon_Paris_1.jpg",
                desc: "Стиль, основанный на подражании античным образцам Древней Греции и Рима. Характеризуется строгой симметрией, стройными колоннадами и гармонией."
            },
            {
                name: "Сентиментализм",
                category: "style",
                categoryLabel: "Литературный стиль",
                years: "Вторая половина XVIII века",
                img: "https://upload.wikimedia.org/wikipedia/commons/8/87/Jean-Baptiste_Greuze_-_The_Spoiled_Child_-_WGA10672.jpg",
                desc: "Направление в литературе и искусстве, поставившее во главу угла человеческие чувства, эмоциональность и душевные переживания вместо сухого разума."
            },
            {
                name: "Готический роман",
                category: "style",
                categoryLabel: "Литературный стиль",
                years: "Конец XVIII — XIX век",
                img: "https://upload.wikimedia.org/wikipedia/commons/3/36/Strawberry_Hill_02.jpg",
                desc: "Жанр литературы, сочетающий тайну, элемент ужаса, мистику и романтику. Действие часто разворачивается в старинных замках, монастырях или руинах."
            }
        ];

        let currentCategory = 'all';

        function renderCards() {
            const grid = document.getElementById('cardsGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const noResults = document.getElementById('noResults');
            
            grid.innerHTML = '';
            let count = 0;

            items.forEach(item => {
                const matchCategory = (currentCategory === 'all' || item.category === currentCategory);
                const matchSearch = item.name.toLowerCase().includes(searchVal) || 
                                    item.desc.toLowerCase().includes(searchVal) ||
                                    item.categoryLabel.toLowerCase().includes(searchVal);

                if (matchCategory && matchSearch) {
                    count++;
                    const badgeClass = `badge-${item.category}`;
                    
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="card-img-container">
                            <img src="${item.img}" alt="${item.name}" class="card-img" referrerpolicy="no-referrer" loading="lazy">
                        </div>
                        <div class="card-body">
                            <span class="badge ${badgeClass}">${item.categoryLabel}</span>
                            <h2 class="card-title">${item.name}</h2>
                            <div class="card-years">${item.years}</div>
                            <p class="card-text">${item.desc}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                }
            });

            noResults.style.display = count === 0 ? 'block' : 'none';
        }

        function setCategory(cat, event) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderCards();
        }

        function filterData() {
            renderCards();
        }

        renderCards();
    </script>
</body>
</html>
