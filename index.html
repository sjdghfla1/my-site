<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банкомат</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .card {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            text-align: center;
            width: 100%;
            max-width: 360px;
            position: relative;
            z-index: 20;
        }
        h1 { color: #38bdf8; margin-bottom: 5px; font-size: 24px; }
        .author {
            color: #f59e0b;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .balance-box {
            background: #090d16;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }
        .balance-label { color: #94a3b8; font-size: 14px; margin-bottom: 5px; }
        .balance-amount { font-size: 28px; font-weight: bold; color: #38bdf8; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #090d16;
            color: #fff;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
        }
        input:focus { border-color: #38bdf8; }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-deposit { background: #22c55e; color: #0f172a; }
        .btn-deposit:hover { background: #4ade80; }
        .btn-withdraw { background: #ef4444; color: #fff; }
        .btn-withdraw:hover { background: #f87171; }
        .btn-firework {
            width: 100%;
            background: #a855f7;
            color: #fff;
            padding: 10px;
            margin-bottom: 15px;
        }
        .btn-firework:hover { background: #c084fc; }
        .message {
            color: #94a3b8;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <canvas id="fireworks"></canvas>

    <div class="card">
        <h1>🏧 Банкомат</h1>
        <div class="author">Этот сайт сделал Дима Усынин</div>
        
        <div class="balance-box">
            <div class="balance-label">Текущий баланс</div>
            <div class="balance-amount"><span id="balance">10 000</span> ₽</div>
        </div>

        <input type="number" id="amount" placeholder="Введите сумму" min="1">

        <div class="btn-group">
            <button class="btn btn-deposit" onclick="deposit()">Пополнить</button>
            <button class="btn btn-withdraw" onclick="withdraw()">Снять</button>
        </div>

        <button class="btn btn-firework" onclick="createFireworkBatch()">🎆 Запустить салют</button>

        <div id="message" class="message">Введите сумму и выберите действие</div>
    </div>

    <script>
        let balance = 10000;

        function updateDisplay(msg, isError = false) {
            document.getElementById('balance').innerText = balance.toLocaleString('ru-RU');
            const messageEl = document.getElementById('message');
            messageEl.innerText = msg;
            messageEl.style.color = isError ? '#ef4444' : '#38bdf8';
        }

        function deposit() {
            const input = document.getElementById('amount');
            const val = Number(input.value);
            if (val > 0) {
                balance += val;
                updateDisplay('Счет пополнен на ' + val + ' ₽');
                input.value = '';
                createFireworkBatch();
            } else {
                updateDisplay('Введите корректную сумму!', true);
            }
        }

        function withdraw() {
            const input = document.getElementById('amount');
            const val = Number(input.value);
            if (val <= 0) {
                updateDisplay('Введите корректную сумму!', true);
            } else if (val > balance) {
                updateDisplay('Недостаточно средств на счете!', true);
            } else {
                balance -= val;
                updateDisplay('Снято ' + val + ' ₽');
                input.value = '';
                createFireworkBatch();
            }
        }

        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.friction = 0.96;
                this.gravity = 0.15;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.02;
            }
        }

        function createFirework(x, y) {
            const colors = ['#38bdf8', '#facc15', '#ef4444', '#22c55e', '#a855f7', '#f43f5e', '#fbbf24'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function createFireworkBatch() {
            const x1 = Math.random() * (canvas.width * 0.8) + canvas.width * 0.1;
            const y1 = Math.random() * (canvas.height * 0.5) + canvas.height * 0.1;
            createFirework(x1, y1);
            setTimeout(() => {
                const x2 = Math.random() * (canvas.width * 0.8) + canvas.width * 0.1;
                const y2 = Math.random() * (canvas.height * 0.5) + canvas.height * 0.1;
                createFirework(x2, y2);
            }, 200);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    p.update();
                    p.draw();
                }
            });
            requestAnimationFrame(animate);
        }

        animate();
        createFireworkBatch();
    </script>
</body>
</html>
